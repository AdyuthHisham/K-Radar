# Noise Injection — Smoke Test, shape-preserving condition.
#
# All effects here keep tensor shapes intact (coordinate shifts, in-place
# zero-out of a fraction of points, additive image noise) so the forward pass
# is guaranteed to run without exercising the None-substitution path in
# datasets/effects/eval_wrapper.py. Values taken from
# outputs/noise_visual_inspection/effect_parameters.yaml.
seed: 42

radar:
  - name: noise_induced_shifts
    p: 1.0
    params:
      shift_std: 2.0
      distribution: gaussian
  - name: loss_partial
    p: 1.0
    params:
      fraction: 0.3

lidar:
  - name: gaussian_noise
    p: 1.0
    params:
      sigma_xy: 0.5
      sigma_z: 0.2
  - name: loss_partial
    p: 1.0
    params:
      fraction: 0.3

camera:
  - name: gaussian_noise
    p: 1.0
    params:
      sigma: 40
